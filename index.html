<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PFS TMO</title>
<style>
:root{--bg:#f2f6f6;--panel:#fff;--ink:#12242b;--mute:#5a6f77;--line:#d3dfe1;--acc:#0a7771;--accfg:#fff;--warn:#b4420f;--warnbg:#fbe9df;--ok:#17703d;--okbg:#e0f3e6;--sel:#e3f1f0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1a1f;--panel:#14262c;--ink:#e6f0f1;--mute:#93aab1;--line:#26404a;--acc:#4fc3ba;--accfg:#06201e;--warn:#f0a075;--warnbg:#3a2418;--ok:#7fd9a1;--okbg:#14301f;--sel:#193a40;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0d1a1f;--panel:#14262c;--ink:#e6f0f1;--mute:#93aab1;--line:#26404a;--acc:#4fc3ba;--accfg:#06201e;--warn:#f0a075;--warnbg:#3a2418;--ok:#7fd9a1;--okbg:#14301f;--sel:#193a40;color-scheme:dark}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
main{max-width:1080px;margin:0 auto;padding:24px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px;letter-spacing:-.01em}
h2{font-size:1.1rem;margin:28px 0 10px}
.sub{color:var(--mute);margin:0 0 20px;max-width:62ch}
textarea{width:100%;min-height:170px;font:13px/1.4 ui-monospace,Menlo,Consolas,monospace;background:var(--panel);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:12px;resize:vertical}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:10px 0}
button,.btn,select,input[type=search]{font:inherit;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:8px 14px;cursor:pointer}
button.pri{background:var(--acc);color:var(--accfg);border-color:var(--acc);font-weight:600}
input[type=search]{cursor:text;min-width:200px;flex:1}
input[type=file]{display:none}
.msg{color:var(--mute);font-size:.9rem}
.sum{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}
.box{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:14px}
.box h3{margin:0 0 6px;font-size:1rem}
.big{font-size:1.9rem;font-weight:700;line-height:1.1}
.tag{display:inline-block;border-radius:99px;padding:1px 9px;font-size:.8rem;border:1px solid var(--line);margin:1px 2px 1px 0;white-space:nowrap}
.tag.warn{background:var(--warnbg);color:var(--warn);border-color:transparent}
.tag.ok{background:var(--okbg);color:var(--ok);border-color:transparent}
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel)}
table{border-collapse:collapse;width:100%;min-width:640px}
th,td{text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:.85rem;color:var(--mute);font-weight:600;position:sticky;top:0;background:var(--panel)}
tr:last-child td{border-bottom:0}
.pnr{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700;letter-spacing:.03em}
tr.flag td{background:var(--warnbg)}
details{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 14px;margin-top:24px}
summary{cursor:pointer;font-weight:600}
dl{margin:10px 0 0;display:grid;grid-template-columns:max-content 1fr;gap:4px 14px}
dt{font-family:ui-monospace,Menlo,Consolas,monospace;font-weight:700}
dd{margin:0}
.hid{display:none}
</style>
</head>
<body>
<main>
<h1>Décodeur PFS</h1>
<p style="margin:0 0 16px;color:var(--mute)">Ce site s’autodétruira quand je serai aux OPS.</p><div id="volbox" class="hid" style="margin-bottom:16px"><div class="sum" id="flights"></div></div>
<textarea id="in" placeholder="PFS&#10;VT4383/02NOV PPT PART1&#10;BOB 06/032&#10;…" aria-label="Texte du PFS"></textarea>
<div class="row">
<button class="pri" id="go">Analyser</button>
<label class="btn" for="file" tabindex="0">Ouvrir un fichier .txt</label>
<input type="file" id="file" accept=".txt,.eml,text/plain">
<button id="clr">Effacer</button>
<span class="msg" id="status"></span>
</div>

<div id="out" class="hid">
<h2>Dossiers (localisateurs)</h2>
<div class="row">
<input type="search" id="q" placeholder="Filtrer par nom ou localisateur" aria-label="Filtrer">
<select id="fd" aria-label="Destination"></select>
<select id="fs" aria-label="Statut"></select>
</div>
<div class="row">
<button id="cp1">Copier les localisateurs</button>
<button id="cp2">Copier le tableau (Excel)</button>
<span class="msg" id="n"></span>
</div>
<div class="scroll"><table>
<thead><tr><th>Dest.</th><th>Localisateur</th><th>Pax</th><th>Passagers</th><th>Cabine</th><th>Statut</th></tr></thead>
<tbody id="tb"></tbody></table></div>
<h2>Statuts présents dans ce PFS</h2>
<dl id="defs"></dl>
</div>

<details>
<summary>Lexique des codes</summary>
<h3 style="margin:0 0 6px;font-size:1rem">Statuts des passagers</h3><dl id="lex"></dl></details>
</main>

<script>
(function(){
var $=function(i){return document.getElementById(i)};
var esc=function(s){return String(s).replace(/[&<>"']/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]})};
var TITLES=["MSTR","MISS","MRS","MR","MS"];
var rows=[],groups=[],lastView=[];
var DEF={
"GOSHO":"Go show : passager embarqué suite à une demande de liste d’attente au comptoir (CKI URES). Selon Amadeus : client qui se présente avec un billet mais sans réservation confirmée sur ce vol (liste d’attente, places disponibles ou réservation sur un autre vol).",
"NOREC":"Selon Amadeus (No Record) : client présent à l’enregistrement avec un billet apparemment valide, introuvable dans les systèmes. Selon votre feuille interne : passager confirmé en GAB (statut KL / HK / KK / RR) mais absent de la liste DCS.",
"NOSHO":"No show : client avec une réservation confirmée qui ne s’enregistre pas, ou qui s’enregistre sans embarquer (Amadeus). Selon votre feuille : ne se présente pas à l’enregistrement de son vol.",
"CHGFL":"Changement de vol au check-in.",
"CHGSG":"Changement de segment.",
"FQTVN":"Numéro FQTV modifié ou ajouté au check-in.",
"IDPAD":"Passager GP non confirmé (R2 ou N2) accepté sur le vol, mais débarquable.",
"CFMWL":"Passager en HL (GAB) confirmé au check-in. À la fermeture du vol, son statut GAB passe en KL.",
"GOSHWN":"Passager enregistré en URES puis débarqué.",
"OFFLK":"Passager réservé et confirmé (GAB et PS), enregistré puis débarqué.",
"OFFLN":"Passager NOREC enregistré puis débarqué.",
"GOSHN":"Code absent de votre liste de définitions (peut-être proche de GOSHWN), à confirmer."
};
Object.assign(DEF,{
"GOSHO":"Go show : passager avec billet open, sans réservation confirmée sur ce vol. Selon votre feuille : embarqué suite à une demande de liste d’attente au comptoir (CKI URES).",
"GOSHN":"Group No Show : groupe qui ne s’est pas présenté (d’après votre document annoté).",
"NOREC":"Billet réservé (OK) dont le nom ne figure pas sur le PNL/ADL. Selon votre feuille : confirmé en GAB (KL / HK / KK / RR) mais absent de la liste DCS.",
"NOSHO":"No show : passager réservé qui ne s’est pas enregistré.",
"CFMWL":"Confirmé depuis la liste d’attente. Selon votre feuille : passager en HL confirmé au check-in ; à la fermeture du vol, son statut GAB passe en KL.",
"CHGCL":"Changement de classe par rapport à la réservation (surclassement ou déclassement).",
"CHGFL":"Changement de vol dû à une irrégularité (recheck).",
"CHGSG":"Changement de segment par rapport à la réservation.",
"FQTVN":"Numéro de grand voyageur (FQTV) modifié ou ajouté au check-in.",
"IDPAD":"Passager employé en places disponibles. Selon votre feuille : passager GP non confirmé (R2 ou N2) accepté sur le vol, mais débarquable.",
"INVOL":"Surclassé ou déclassé vers un autre compartiment de façon involontaire.",
"OFFLK":"Passager réservé, enregistré puis débarqué.",
"OFFLN":"Passager NOREC enregistré puis débarqué."
});
Object.assign(DEF,{
"CFMWL":"Confirm from waitlist.",
"CHGCL":"Change of class from RES booking (upgrade/downgrade).",
"CHGFL":"Change of flight due to flight irregularity (recheck).",
"CHGSG":"Change of segment from RES booking.",
"GOSHO":"Go Show. Open ticket passenger.",
"GOSHN":"Group No Show.",
"FQTVN":"Frequent flyer number changed or added at check-in.",
"IDPAD":"Space available staff passenger.",
"INVOL":"Upgraded or downgraded to a different compartment involuntarily.",
"NOREC":"Booked (OK) ticket but name not on PNL/ADL.",
"NOSHO":"Booked passenger that did not check-in.",
"OFFLK":"Booked passenger that was checked-in, then offloaded.",
"OFFLN":"NOREC passenger that was checked-in, then offloaded."
});
delete DEF.GOSHWN;
DEF={
"CFMWL":"Passager confirmé depuis la liste d’attente. Au check-in, il passe de HL à confirmé ; à la fermeture du vol, son statut GAB passe en KL.",
"CHGCL":"Changement de classe par rapport à la réservation (surclassement ou déclassement).",
"CHGFL":"Changement de vol au check-in, dû à une irrégularité du vol (recheck).",
"CHGSG":"Changement de segment par rapport à la réservation.",
"FQTVN":"Numéro de grand voyageur (FQTV) modifié ou ajouté au check-in.",
"GOSHN":"Group No Show : groupe qui ne s’est pas présenté.",
"GOSHO":"Go show : passager avec billet open, embarqué suite à une demande de liste d’attente au comptoir (CKI URES).",
"GOSHWN":"Passager enregistré en URES puis débarqué.",
"IDPAD":"Passager employé en places disponibles : passager GP non confirmé (R2 ou N2) accepté sur le vol, mais débarquable.",
"INVOL":"Surclassé ou déclassé vers un autre compartiment de façon involontaire.",
"NOREC":"Passager confirmé en GAB (KL / HK / KK / RR) dont le nom n’apparaît pas sur le PNL/ADL ni sur la liste DCS.",
"NOSHO":"No show : passager réservé qui ne s’est pas présenté à l’enregistrement de son vol.",
"OFFLK":"Passager réservé et confirmé (GAB et PS), enregistré puis débarqué.",
"OFFLN":"Passager NOREC enregistré puis débarqué."
};
DEF={
"CFMWL":"Passager confirmé à la fermeture du vol mais qui était déjà en HL avant check-in.",
"CHGCL":"Changement de classe par rapport à la réservation.",
"CHGFL":"Changement de vol au check-in, dû à une irrégularité du vol. (DISRUPT)",
"CHGSG":"Changement de segment par rapport à la réservation. (PPTRFPMAU iso PPTMAU)",
"FQTVN":"Numéro FQTV modifié ou ajouté au check-in.",
"GOSHN":"Passager REAC qui ne s’est pas présenté à l’enregistrement de son vol.",
"GOSHO":"Passager confirmé à la fermeture du vol qui s’est ajouté en HL au check-in. (voir liste 32 dans cm en cas de grève)",
"IDPAD":"GP R2 accepté sur le vol, mais débarquable.",
"INVOL":"Modification de Cabine (surclassement ou déclassement) de façon involontaire.",
"NOREC":"Passager confirmé mais qui n’apparaît pas sur la PNL.",
"NOSHO":"No show : passager réservé qui ne s’est pas présenté à l’enregistrement de son vol.",
"OFFLK":"Passager réservé, confirmé et enregistré puis débarqué.",
"OFFLN":"Passager NOREC enregistré puis débarqué."
};
var WARN=["NOREC","OFFLN","OFFLK","NOSHO","GOSHN","INVOL"];
function isWarn(s){return WARN.indexOf(s)>=0}

function splitTitle(f){
  for(var i=0;i<TITLES.length;i++){var t=TITLES[i];
    if(f.length>t.length+1&&f.slice(-t.length)===t)return [f.slice(0,-t.length),t];}
  return [f,""];
}

function parse(text){
  var lines=text.split(/\r?\n/).map(function(l){return l.trim()}).filter(Boolean);
  var flights=[],decl={},raw=[],dest=null,cat=null,cabin=null,cur=null,m;
  lines.forEach(function(l){
    if(l==="PFS"||l==="ENDPFS"){cur=null;return}
    if(m=l.match(/^([A-Z0-9]{2}\d{1,4})\/(\d{2}[A-Z]{3})\s+([A-Z]{3})(?:\s+PART(\d+))?/)){
      flights.push({no:m[1],date:m[2],from:m[3],part:m[4]||"1"});dest=null;cat=null;cur=null;return}
    if(m=l.match(/^-([A-Z]{3})$/)){dest=m[1];cat=null;cur=null;return}
    if(m=l.match(/^([A-Z]{3}) (\d+)\/(\d+)$/)){
      var d=decl[m[1]]||(decl[m[1]]={c:0,y:0});d.c+=+m[2];d.y+=+m[3];return}
    if(m=l.match(/^([A-Z]{4,6}) (\d+)([A-Z])$/)){cat=m[1];cabin=m[3];cur=null;return}
    if(m=l.match(/^(\d+)([^\/]+)\/(.+)$/)){
      var ft=splitTitle(m[3]);
      cur={dest:dest||"?",cat:cat||"?",cabin:cabin||"?",sn:m[2].trim(),fn:ft[0].trim(),title:ft[1],pnr:"",docs:{}};
      raw.push(cur);return}
    if(!cur)return;
    if(m=l.match(/^\.L\/(\w+)/)){cur.pnr=m[1];return}
    if(m=l.match(/^\.R\/(\w+)/)){cur.docs[m[1]]=1}
  });
  // fusion des doublons (même passager listé dans APIPX et GOSHO)
  var map={},pax=[];
  raw.forEach(function(r){
    var k=[r.dest,r.pnr,r.sn,r.fn].join("|"),e=map[k];
    if(!e){e=map[k]={dest:r.dest,pnr:r.pnr,sn:r.sn,fn:r.fn,title:r.title,cat:r.cat,cabin:r.cabin,docs:{}};pax.push(e)}
    else if(e.cat==="APIPX"&&r.cat!=="APIPX"){e.cat=r.cat;e.cabin=r.cabin}
    for(var d in r.docs)e.docs[d]=1;
  });
  return {flights:flights,decl:decl,pax:pax,rawCount:raw.length};
}

function build(res){
  var gm={},list=[];
  res.pax.forEach(function(p){
    var k=p.dest+"|"+p.pnr,g=gm[k];
    if(!g){g=gm[k]={dest:p.dest,pnr:p.pnr||"(aucun)",pax:[],cats:{},cabins:{}};list.push(g)}
    g.pax.push(p);g.cats[p.cat]=1;g.cabins[p.cabin]=1;
  });
  return list;
}

function render(res){
  rows=res.pax;groups=build(res);
  var fl=res.flights.map(function(f){return '<div class="box"><h3>'+esc(f.no)+'</h3><div class="big">'+esc(f.date)+'</div><div class="msg">Départ '+esc(f.from)+', partie '+esc(f.part)+'</div></div>'}).join("");
  $("flights").innerHTML=fl;$("volbox").classList.remove("hid");

  var dests=[];rows.forEach(function(p){if(dests.indexOf(p.dest)<0)dests.push(p.dest)});

  fill($("fd"),"Toutes destinations",dests);
  var cs=[];rows.forEach(function(p){if(cs.indexOf(p.cat)<0)cs.push(p.cat)});
  fill($("fs"),"Tous statuts",cs);
  $("defs").innerHTML=cs.filter(function(c){return DEF[c]}).map(function(c){return '<dt>'+esc(c)+'</dt><dd>'+esc(DEF[c])+'</dd>'}).join("");
  $("out").classList.remove("hid");
  table();
}
function fill(sel,all,vals){
  sel.innerHTML='<option value="">'+all+'</option>'+vals.map(function(v){return '<option>'+esc(v)+'</option>'}).join("");
}

function statusOf(g){var k=Object.keys(g.cats);var real=k.filter(function(c){return c!=="APIPX"});return real.length?real:k}

function table(){
  var q=$("q").value.trim().toLowerCase(),fd=$("fd").value,fs=$("fs").value;
  lastView=groups.filter(function(g){
    if(fd&&g.dest!==fd)return false;
    if(fs&&statusOf(g).indexOf(fs)<0)return false;
    if(q){var hay=(g.pnr+" "+g.pax.map(function(p){return p.sn+" "+p.fn}).join(" ")).toLowerCase();if(hay.indexOf(q)<0)return false}
    return true;
  });
  $("tb").innerHTML=lastView.map(function(g){
    var st=statusOf(g),flag=st.some(isWarn);
    return '<tr'+(flag?' class="flag"':'')+'><td>'+esc(g.dest)+'</td><td class="pnr">'+esc(g.pnr)+'</td><td>'+g.pax.length+'</td><td>'+
      g.pax.map(function(p){return esc(p.sn+" "+p.fn)}).join("<br>")+'</td><td>'+Object.keys(g.cabins).map(esc).join(", ")+'</td><td>'+
      st.map(function(s){return '<span class="tag'+(isWarn(s)?' warn':'')+'" title="'+esc(DEF[s]||"")+'">'+esc(s)+'</span>'}).join("")+'</td></tr>';
  }).join("")||'<tr><td colspan="6" class="msg">Aucun dossier ne correspond au filtre.</td></tr>';
  $("n").textContent=lastView.length+" dossier(s) affiché(s)";
}

function run(){
  $("volbox").classList.add("hid");
  var t=$("in").value;
  if(!t.trim()){$("status").textContent="Collez d’abord le texte du PFS.";$("out").classList.add("hid");return}
  var res=parse(t);
  if(!res.pax.length){$("status").textContent="Aucun passager reconnu. Vérifiez que le texte vient bien d’un PFS.";$("out").classList.add("hid");return}
  $("status").textContent=res.rawCount+" lignes passagers lues, "+res.pax.length+" passagers uniques.";
  render(res);
}

function copy(t,btn){
  var label=btn.textContent;
  function done(){btn.textContent="Copié";setTimeout(function(){btn.textContent=label},1500)}
  function fb(){var ta=document.createElement("textarea");ta.value=t;ta.style.position="fixed";ta.style.opacity="0";document.body.appendChild(ta);ta.select();try{document.execCommand("copy")}catch(e){}ta.remove();done()}
  try{navigator.clipboard.writeText(t).then(done,fb)}catch(e){fb()}
}

$("lex").innerHTML=Object.keys(DEF).map(function(c){return '<dt>'+c+'</dt><dd>'+esc(DEF[c])+'</dd>'}).join("");
$("go").onclick=run;
$("in").addEventListener("paste",function(){setTimeout(run,50)});
$("clr").onclick=function(){$("in").value="";$("volbox").classList.add("hid");$("out").classList.add("hid");$("status").textContent=""};
$("q").oninput=table;$("fd").onchange=table;$("fs").onchange=table;
$("cp1").onclick=function(){copy(lastView.map(function(g){return g.pnr}).join("\n"),$("cp1"))};
$("cp2").onclick=function(){
  var h=["Destination","Localisateur","Nb pax","Passagers","Cabine","Statut"].join("\t");
  copy([h].concat(lastView.map(function(g){return [g.dest,g.pnr,g.pax.length,g.pax.map(function(p){return p.sn+" "+p.fn}).join(" / "),Object.keys(g.cabins).join(","),statusOf(g).join(",")].join("\t")})).join("\n"),$("cp2"));
};
$("file").onchange=function(e){
  var f=e.target.files&&e.target.files[0];if(!f)return;
  var r=new FileReader();r.onload=function(){$("in").value=String(r.result);run()};r.readAsText(f);
};
document.querySelector('label[for=file]').onkeydown=function(e){if(e.key==="Enter"||e.key===" "){e.preventDefault();$("file").click()}};
})();
</script>
</body>
</html>
